[package]
name = "dopper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.82"
clap = { version = "4.5.4", features = ["derive"] }
comfy-table = "7.1.1"
directories = "5.0.1"
md5 = "0.7.0"
path-clean = "1.0.1"
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher", "functions"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "1.0.59"
tokio = { version = "1.37.0", features = ["full"] }
toml = "0.9.9"
uuid = { version = "1.8.0", features = ["v4"] }
argon2 = "0.4.1"
base64 = "0.22.1"
rand = "0.8"
hex = "0.4"
log = "0.4.29"
env_logger = "0.11.8"
rpassword = "7.4.0"
zeroize = { version = "1.7.0", features = ["derive"] }

[patch.crates-io]
base64ct = { path = "vendor/base64ct-1.6.0" }

[dev-dependencies]
tempfile = "3.23.0"
